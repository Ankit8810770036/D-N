<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#081c15" />
    <meta name="description" content="Metrivita — AI-powered personalized diet planner and nutrition tracker based on your health metrics." />
    <title>Metrivita — Diet & Nutrition Planner</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon-192.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <noscript>
      <div style="font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; background: #081c15; color: #fff; text-align: center;">
        <h1 style="font-size: 24px; margin-bottom: 12px; color: #10b981;">🥗 Metrivita Requires JavaScript</h1>
        <p style="font-size: 14px; max-width: 480px; color: #94a3b8; line-height: 1.6;">
          JavaScript is required to run the interactive health calculations, meal planner, and dashboard. Please enable JavaScript in your browser settings to continue.
        </p>
      </div>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((reg) => console.log('PWA Service Worker registered:', reg.scope))
            .catch((err) => console.warn('PWA Service Worker registration failed:', err));
        });
      }
    </script>
  </body>
</html>
